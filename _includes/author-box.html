<section class="author-box">
  {% if site.author-pic %}
  <img src="{{ '/assets/img/' | append: site.author-pic | prepend: site.baseurl }}"
       alt="{{ site.author }}" class="author-img">
  {% endif %}

  <div class="author-desc">
    <h2>{{ site.author }}</h2>
    <p>{{ site.about-author }}</p>
    <ul>
      {% if site.email %}
      <li class="email">
        <a href="mailto:{{ site.email }}" aria-label="邮箱"><i class="fa fa-envelope-o" aria-hidden="true"></i></a>
      </li>
      {% endif %}

      {% if site.website %}
      <li class="website">
        <a href="https://{{ site.website }}" target="_blank" rel="noopener noreferrer" aria-label="个人网站">
          <i class="fa fa-globe" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}

      {% if site.github %}
      <li class="github">
        <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fa fa-github" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}

      {% if site.twitter %}
      <li class="twitter">
        <a href="https://twitter.com/{{ site.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
          <i class="fa fa-twitter" aria-hidden="true"></i>
        </a>
      </li>
      {% endif %}
    </ul>
  </div>
</section>

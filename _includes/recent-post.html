{% assign recent_posts = site.posts | where_exp: "post", "post.url != page.url" %}

<div class="recent-box">
  <h2 class="recent-title">Recent post</h2>
  <div class="recent-list">
    {% for post in recent_posts limit: 4 %}
    <a href="{{ post.url | prepend: site.baseurl }}"
       class="recent-item"{% if post.img %}
       style="background: url('{{ '/assets/img/' | append: post.img | prepend: site.baseurl }}') center no-repeat; background-size: cover;"{% endif %}>
      <span>{{ post.title }}</span>
    </a>
    {% endfor %}
  </div>
</div>

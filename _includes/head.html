<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ site.author }}">

  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">

  <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | prepend: site.baseurl }}">

  <!-- 浏览器主题色 -->
  <meta name="theme-color" content="#311e3e">
  <meta name="msapplication-navbutton-color" content="#311e3e">
  <meta name="apple-mobile-web-app-status-bar-style" content="#311e3e">

  <!-- 字体与图标 -->
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700%7CMontserrat:300,400,700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/fonts/font-awesome/css/font-awesome.min.css' | prepend: site.baseurl }}">

  <!-- 站点样式 -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | prepend: site.baseurl }}">
</head>

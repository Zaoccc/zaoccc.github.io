<footer class="main-footer">
  <div class="copyright">
    <p>{{ site.time | date: '%Y' }} &copy; {{ site.author }} Starting at 2022</p>
    <a href="https://qm.qq.com/cgi-bin/qm/qr?k=MKKIoE1fcITIi9M9Sxm0jna-YKJhwHyR&amp;noverify=0"
       target="_blank" rel="noopener noreferrer" aria-label="QQ">
      <i class="fa fa-qq fa-lg" aria-hidden="true"></i>
    </a>
  </div>

  {% if site.163music %}
  <div class="music-player">
    <iframe frameborder="no" border="0" marginwidth="0" marginheight="0"
            width="298" height="52" title="网易云音乐播放器" src="https://{{ site.163music }}"></iframe>
  </div>

</footer>
